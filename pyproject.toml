[project]
name = "sparkline"
version = "0.1.0"
description = "A service for generating sparkline graphs"
authors = [
  { name="Alexander Ryabov", email="alex.ryabov@gmail.com" },
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.108.0",
    "matplotlib>=3.8.2",
    "sentry-sdk>=1.39.1",
    "uvicorn[standard]>=0.25.0",
    "aiomcache>=0.8.1",
]

[tool.ruff]
line-length = 150
target-version = "py312"
