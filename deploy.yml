#!/usr/bin/env ansible-playbook
---
- name: Deploy Sparkline
  hosts: all
  strategy: free
  gather_facts: false
  vars:
    project: sparkline
    env: prod
    owner: deploy
    slug: "{{ project }}-{{ env }}"
    prefix: /var/www/{{ slug }}
    uv_env:
      UV_PYTHON_INSTALL_DIR: "{{ prefix }}/.python" # keep interpreter readable by supervisor's `nobody`
  tasks:
    - name: Remove existing virtualenv and interpreter
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: ["{{ prefix }}/.venv", "{{ prefix }}/.python"]
      tags: full

    - name: Create project directory
      ansible.builtin.file:
        path: "{{ prefix }}"
        state: directory
        owner: "{{ owner }}"
        group: "{{ owner }}"
        mode: "0755"

    - name: Upload {{ playbook_dir }} to {{ prefix }}
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/"
        dest: "{{ prefix }}"
        rsync_path: sudo -u {{ owner }} rsync

    - name: Install dependencies
      ansible.builtin.command: uv sync --frozen
      args:
        chdir: "{{ prefix }}"
      environment: "{{ uv_env }}"
      become: true
      become_user: "{{ owner }}"
      changed_when: true

    - name: Install supervisor config
      ansible.builtin.file:
        state: link
        src: "{{ prefix }}/supervisor-{{ env }}.conf"
        dest: /etc/supervisor/conf.d/{{ slug }}.conf
      tags: full

    - name: Register process with supervisor
      community.general.supervisorctl:
        name: "{{ slug }}"
        state: present
      tags: full

    - name: Restart process
      community.general.supervisorctl:
        name: "{{ slug }}"
        state: restarted
      tags: restart
